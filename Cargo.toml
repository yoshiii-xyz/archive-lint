[package]
name = "archive-lint"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Inspect tar archives for extraction hazards without extracting them"
license = "MIT"
repository = "https://github.com/joshiii-xyz/archive-lint"
readme = "README.md"
keywords = ["archive", "security", "tar", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"
